name: CI

on:
  push:
  pull_request:

jobs:
  bash-syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check shell scripts
        run: |
          bash -n claude-box
          bash -n codex-box
          bash -n libcage.sh
          bash -n entrypoint-cage.sh
          bash -n userns-probe.sh
          bash -n payload-init-claude.sh
